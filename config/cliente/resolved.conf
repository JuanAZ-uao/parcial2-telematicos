#  /etc/systemd/resolved.conf - cliente-1005968285
#  DNS sobre TLS (DoT, puerto 853/tcp) con systemd-resolved.
#  Formato: IP#nombre -> el nombre se usa para validar el certificado del resolver (SNI).
#  Ver resolved.conf(5).

[Resolve]
DNS=1.1.1.1#cloudflare-dns.com 8.8.8.8#dns.google 9.9.9.9#dns.quad9.net
FallbackDNS=1.0.0.1#cloudflare-dns.com 8.8.4.4#dns.google 149.112.112.112#dns.quad9.net
# "~." = estos servidores globales atienden TODOS los dominios
Domains=~.
# yes = estricto: solo DoT, si el TLS falla la resolucion falla (no hay degradacion a UDP/53)
DNSOverTLS=yes
DNSSEC=no
Cache=yes
DNSStubListener=yes
