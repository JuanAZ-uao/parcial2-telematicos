# /etc/vsftpd.conf - Servidor 2 (srv2-1005968285)
# FTPS con TLS explicito (AUTH TLS sobre el puerto 21), solo modo pasivo.

# --- Servicio ---
listen=YES
listen_ipv6=NO
pam_service_name=vsftpd
secure_chroot_dir=/var/run/vsftpd/empty
use_localtime=YES
dirmessage_enable=YES

# --- Usuarios: solo locales y solo los listados en /etc/vsftpd.userlist ---
anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022
chroot_local_user=YES
allow_writeable_chroot=YES
userlist_enable=YES
userlist_file=/etc/vsftpd.userlist
userlist_deny=NO

# --- Registro ---
xferlog_enable=YES
xferlog_std_format=NO
log_ftp_protocol=YES
vsftpd_log_file=/var/log/vsftpd.log

# --- Modo pasivo (debe coincidir con las reglas de UFW del Servidor 1) ---
pasv_enable=YES
pasv_min_port=50000
pasv_max_port=50010
# IP que se anuncia en la respuesta 227 (PASV): la del Servidor 1, no la interna
pasv_address=192.168.56.10
# Modo activo deshabilitado: el firewall solo publica el rango pasivo
port_enable=NO
connect_from_port_20=NO

# --- TLS (FTPS explicito) ---
ssl_enable=YES
rsa_cert_file=/etc/ssl/parcial2/servidor.crt
rsa_private_key_file=/etc/ssl/parcial2/servidor.key
allow_anon_ssl=NO
# Obliga cifrado de autenticacion (USER/PASS) y del canal de datos
force_local_logins_ssl=YES
force_local_data_ssl=YES
# Protocolos inseguros deshabilitados
ssl_sslv2=NO
ssl_sslv3=NO
# TLS 1.0/1.1 tambien obsoletos: solo TLS 1.2 y 1.3
# (el binario usa ssl_tlsv11/12/13 aunque el man diga ssl_tlsv1_1...)
ssl_tlsv1=NO
ssl_tlsv11=NO
ssl_tlsv12=YES
ssl_tlsv13=YES
ssl_ciphers=HIGH
require_ssl_reuse=NO
